<!doctype html>
<html lang="en">
  <head>
    <title>Uppy Companion example</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://releases.transloadit.com/uppy/v6.0.9/uppy.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <button type="button" id="uppyModalOpener">Open Modal</button>
    <noscript>This web page requires JavaScript to work properly.</noscript>
    <script type="module">
      import {
        Dashboard,
        GoogleDrive,
        Tus,
        Uppy,
      } from 'https://releases.transloadit.com/uppy/v6.0.9/uppy.min.mjs'

      const uppy = new Uppy({ debug: true, autoProceed: false })
        .use(Dashboard, { trigger: '#uppyModalOpener' })
        .use(GoogleDrive, {
          target: Dashboard,
          companionUrl: 'http://localhost:3020',
        })
        .use(Tus, { endpoint: 'https://tusd.tusdemo.net/files/' })

      uppy.on('complete', (result) => {
        console.log(`${result.successful.length} files uploaded`)
      })
    </script>
  </body>
</html>
