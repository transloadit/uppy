# Basic set up for three package managers

version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    ignore:
      # cropperjs 2 is a rewrite on web components, not a drop-in upgrade:
      # moving @uppy/image-editor to it is a breaking change of its own.
      # 1.7.0 measures images with a hidden <img> that page CSS such as
      # `img { width: 100% }` resizes, which changes the saved size, so the
      # image editor stays on 1.6.x until that is fixed.
      - dependency-name: 'cropperjs'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      Angular:
        patterns:
          - '@angular*'
          - 'ng-*'

      AWS:
        patterns:
          - '@aws-sdk/*'

      Docusaurus:
        patterns:
          - '@docusaurus/*'

      React:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'

      React Router:
        patterns:
          - '@react-router/*'
          - react-router

      Vitest:
        patterns:
          - '@testing-library/*'
          - '@vitest/*'
          - playwright
          - vitest

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

    groups:
      Docker:
        patterns:
          - docker/*
