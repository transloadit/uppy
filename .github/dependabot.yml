# Basic set up for three package managers

version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      Angular:
        patterns:
          - '@angular*'
          - 'ng-*'

      AWS:
        patterns:
          - '@aws-sdk/*'

      Docusaurus:
        patterns:
          - '@docusaurus/*'

      React:
        patterns:
          - 'react*'
          - '@types/react*'

      React Router:
        patterns:
          - '@react-router/*'

      Vitest:
        patterns:
          - '@testing-library/*'
          - '@vitest/*'
          - playwright
          - vitest

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'

    groups:
      Docker:
        patterns:
          - docker/*
