name: CI

on:
  push:
    branches: [main]
  pull_request:
    # We want all branches so we configure types to be the GH default again
    types: [opened, synchronize, reopened]

# Key on the PR number, not `head_ref`: branch names from different forks
# (e.g. two `patch-1` PRs) would otherwise cancel each other's runs. Pushes
# to main fall back to `run_id`, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The repository is public, so checking it out needs no token scopes, and the
# Actions cache (actions/cache, buildx `type=gha`) authenticates with the
# runtime token, not GITHUB_TOKEN. Grant scopes per job if one ever needs them.
permissions: {}

env:
  SKIP_YARN_COREPACK_CHECK: true
  YARN_ENABLE_GLOBAL_CACHE: false

jobs:
  docker:
    name: Companion Docker image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          load: true
          tags: companion:ci
          cache-from: type=gha,scope=companion-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=companion-${{ matrix.arch }}
      # A successful build doesn't prove the image runs, so start it and wait
      # for its health check to pass, both with the defaults and with a custom
      # port and path.
      - name: Smoke test
        run: |
          smoke_test() {
            name=$1
            shift
            docker run --detach --name "$name" \
              --env COMPANION_SECRET=ci --env COMPANION_DOMAIN=localhost:3020 \
              --env COMPANION_DATADIR=/tmp --env COMPANION_CLIENT_ORIGINS=true \
              "$@" companion:ci
            for _ in $(seq 30); do
              [ "$(docker inspect --format '{{.State.Health.Status}}' "$name")" = healthy ] && return 0
              sleep 1
            done
            docker logs "$name"
            return 1
          }
          smoke_test default
          smoke_test custom --env COMPANION_PORT=3021 --env COMPANION_PATH=/companion

  unit_tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        # The other jobs use the version in .node-version, which should be the
        # newest one here.
        node-version:
          - '22.23.4'
          - '24.22.1'
          - '26.12.1'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{matrix.node-version}}
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run:
          corepack yarn install --immutable
      - name: Install Playwright Browsers
        run: corepack yarn workspace @uppy/dashboard playwright install --with-deps chromium
      - name: Build
        run: corepack yarn run build
      - name: Run tests
        run: corepack yarn run test
        env:
          COMPANION_DATADIR: ./output
          COMPANION_DOMAIN: localhost:3020
          COMPANION_PROTOCOL: http
          COMPANION_REDIS_URL: redis://localhost:6379
          VITE_MINIO_CONFIG: "test_user,test_password,http://localhost:9002/test-bucket,us-east-1"
      # The examples aren't covered by `yarn build` (packages only) or
      # `yarn test` (react/vue/sveltekit only), so build and typecheck them
      # explicitly. Run it after the unit tests so an example-only breakage
      # doesn't mask the test results.
      - name: Build and check examples
        run: corepack yarn run build:examples

  # The @uppy/url browser tests start Companion behind a load balancer with
  # Redis (multi-instance), so they need the build and a Redis service.
  # `unit_tests` already runs the same browser project on every Node version,
  # so this runs on one version only.
  e2e_tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Install Playwright Browsers
        run: corepack yarn workspace @uppy/dashboard playwright install --with-deps chromium
      - name: Build
        run: corepack yarn run build
      # This uncached task needs the Companion fixture environment in Turbo.
      - name: Run end-to-end tests
        run: corepack yarn run test:e2e
        env:
          TURBO_ENV_MODE: loose
          COMPANION_PROTOCOL: http
          COMPANION_REDIS_URL: redis://localhost:6379

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run:
          corepack yarn install --immutable
      - run: corepack yarn run typecheck

  lint_js:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Install dependencies
        run:
          corepack yarn workspaces focus @uppy-dev/build
      - name: Run linter
        run: corepack yarn run check:ci

  lint_mdx:
    name: Lint (MDX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Install dependencies
        run: corepack yarn workspaces focus @uppy-dev/build
      - name: Run linter
        run: corepack yarn run check:mdx

  lint_md:
    name: Lint (Markdown)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Install dependencies
        run: corepack yarn workspaces focus @uppy-dev/build
      - name: Run linter
        run: corepack yarn run check:md

  lint_lockfile:
    name: Lint yarn.lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: corepack yarn install --immutable --mode=skip-build
      - name: Check for duplicate dependencies
        run: corepack yarn dedupe --check

  # Deploying the site stays in deploy-website.yml, which needs Pages scopes.
  website:
    name: Build and test (uppy.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install Corepack
        run: npm install --global corepack@0.36.0
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run:
          echo "dir=$(corepack yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: corepack yarn install --immutable
      - name: Build Uppy
        run: corepack yarn run build
      - name: Build website
        run: corepack yarn workspace uppy-io build
      - name: Test website
        run: corepack yarn workspace uppy-io test
