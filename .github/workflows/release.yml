name: release

on:
  push:
    branches:
      - main

permissions:
  actions: read # Inspect the required-reviewer environment before approval and publish
  contents: read

jobs:
  preflight:
    name: Preview client publication
    runs-on: ubuntu-latest
    outputs:
      approval_required: ${{ steps.plan.outputs.approval_required }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
      - run: corepack yarn config set enableHardenedMode false
      - run: corepack yarn --mode=update-lockfile
      - run: corepack yarn install --immutable
      - name: List packages and check approval protection
        id: plan
        run: node scripts/release-approval.mjs prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPANION_OAUTH_CANARY_URL: ${{ vars.COMPANION_OAUTH_CANARY_URL }}

  approve_client:
    name: Approve OAuth-client publication
    needs: preflight
    if: needs.preflight.outputs.approval_required == 'true'
    runs-on: ubuntu-latest
    environment: oauth-client-publication
    steps:
      - run: echo 'Protected approval granted; publication will recheck the plan and environment.'

  release:
    name: Release
    needs: [preflight, approve_client]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.approve_client.result == 'success' || (needs.preflight.outputs.approval_required == 'false' && needs.approve_client.result == 'skipped')) }}
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write # Required for OIDC
      contents: write
      pull-requests: write
    env:
      AWS_REGION: auto
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      DOCKER_BUILDKIT: 0
      COMPOSE_DOCKER_CLI_BUILD: 0
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"

      # Allow yarn to make changes during release
      - run: corepack yarn config set enableHardenedMode false
      - run: corepack yarn --mode=update-lockfile

      - name: Install dependencies
        run: corepack yarn install --immutable

      - name: Build
        run: corepack yarn build

      - run: corepack yarn workspace @uppy/angular pack

      - name: Refuse superseded release commit
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: corepack yarn run version
          publish-script: corepack yarn run release
          commit-message: "[ci] release"
          pr-title: "[ci] release"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          EXPECTED_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          RELEASE_APPROVAL_RESULT: ${{ needs.approve_client.result }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if Companion version changed
        id: checkIfCompanionWasReleased
        # A full rerun after npm succeeded must still retry Docker publication.
        if: ${{ contains(fromJSON(steps.changesets.outputs['published-packages']).*.name, '@uppy/companion') || (steps.changesets.outputs.has-changesets == 'false' && startsWith(github.event.head_commit.message, '[ci] release')) }}
        run: |
          if [ "$COMPANION_PUBLISHED" = true ] || ! git diff --exit-code --quiet HEAD^ -- packages/@uppy/companion/package.json; then echo "version=$(jq -r .version < packages/@uppy/companion/package.json)" >> "$GITHUB_OUTPUT"; fi
        env:
          COMPANION_PUBLISHED: ${{ contains(fromJSON(steps.changesets.outputs['published-packages']).*.name, '@uppy/companion') }}

      - name: Upload `uppy` to CDN
        if: ${{ steps.changesets.outputs.published == 'true' && contains(fromJSON(steps.changesets.outputs['published-packages']).*.name, 'uppy') }}
        run: node packages/uppy/upload-to-cdn.js uppy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Upload `@uppy/locales` to CDN if it was released
        if: steps.changesets.outputs.published == 'true'
        run: node packages/uppy/upload-to-cdn.js @uppy/locales
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Checkout sources
        if: steps.checkIfCompanionWasReleased.outputs.version
        uses: actions/checkout@v7
      - name: Docker meta
        if: steps.checkIfCompanionWasReleased.outputs.version
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: transloadit/companion
          tags: |
            type=edge
            type=semver,pattern={{version}},value=${{ steps.checkIfCompanionWasReleased.outputs.version }}
            # set latest tag for default branch
            type=raw,value=latest,enable=true
      - if: steps.checkIfCompanionWasReleased.outputs.version
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.checkIfCompanionWasReleased.outputs.version
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to DockerHub
        if: steps.checkIfCompanionWasReleased.outputs.version
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Build and push
        if: steps.checkIfCompanionWasReleased.outputs.version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          platforms: linux/amd64,linux/arm64
          file: Dockerfile
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
