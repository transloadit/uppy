changesetBaseRefs:
  - main
  - upstream/main
  - origin/main

compressionLevel: mixed

enableHardenedMode: false

initScope: uppy

nodeLinker: node-modules

npmMinimalAgeGate: 1w

# Transloadit's own packages, consumed by @uppy/transloadit-storage.
npmPreapprovedPackages:
  - "@transloadit/utils"

npmPublishAccess: public
