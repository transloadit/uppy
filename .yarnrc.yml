changesetBaseRefs:
  - main
  - upstream/main
  - origin/main

compressionLevel: mixed

enableHardenedMode: false

initScope: uppy

nodeLinker: node-modules

npmMinimalAgeGate: 1w

# Transloadit's own packages; the dev harness signs Smart CDN URLs with @transloadit/utils.
npmPreapprovedPackages:
  - "@transloadit/utils"

npmPublishAccess: public
