services:
  minio:
    # quay.io/minio/minio (and minio/minio on Docker Hub) are no longer
    # publicly pullable. pgsty/minio is a community build that bundles both
    # `minio` and `mc`; pinned by digest since it's a third-party image.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    ports:
      - 9002:9002
      - 9003:9003
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ADDRESS: ':9002'
      MINIO_CONSOLE_ADDRESS: ':9003'
      MC_HOST_local: 'http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9002'
    command: minio server /data
    healthcheck:
      test: mc ready local
      start_period: 5s
      interval: 30s
      timeout: 3s
      retries: 3
